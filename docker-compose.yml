services:

  mysql:
    image: mysql:8.0
    container_name: subscription-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: subscription_db
      MYSQL_USER: subscription_user
      MYSQL_PASSWORD: subscription_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3307:3306"

    volumes:
      - subscription_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: subscription-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - subscription_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  subscription_mysql_data:
  subscription_redis_data: